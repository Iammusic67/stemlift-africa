<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Draft Editor</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      textarea { width: 100%; height: 320px; font-family: monospace; }
      .button-row { margin-top: 12px; display:flex; gap:8px; }
      .note { margin-top:8px; color:#555; }
    </style>
  </head>
  <body>
    <h1>Quiz Draft Editor</h1>
    <p>Draft quiz questions here. Use the simple CSV format below (comma-separated):
    <br /><strong>question,option1|option2|option3|option4,answer</strong>
    </p>
    <textarea id="draft-area">What is 2+2?,4|3|5|2,4
Name the planet closest to the Sun,Venus|Earth|Mercury|Mars,Mercury</textarea>

    <div class="button-row">
      <button id="download-csv">Download as CSV (Excel)</button>
      <button id="download-html">Download as HTML (LibreOffice Writer)</button>
      <button id="preview">Preview</button>
    </div>

    <div id="preview-area" style="margin-top:12px"></div>

    <script>
      const parseDraft = (text) => {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        return lines.map((line) => {
          const parts = line.split(',');
          const question = parts[0] || '';
          const options = (parts[1] || '').split('|').map(s => s.trim()).filter(Boolean);
          const answer = parts[2] ? parts[2].trim() : '';
          return { question, options, answer };
        });
      };

      document.getElementById('download-csv').addEventListener('click', () => {
        const text = document.getElementById('draft-area').value;
        const rows = parseDraft(text).map(q => [q.question, q.options.join('|'), q.answer]);
        const csv = rows.map(r => r.map(cell => '"' + cell.replace(/"/g,'""') + '"').join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'quiz-draft.csv'; document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('download-html').addEventListener('click', () => {
        const text = document.getElementById('draft-area').value;
        const items = parseDraft(text);
        const html = `<!doctype html><html><head><meta charset="utf-8"><title>Quiz Draft</title></head><body><h1>Quiz Draft</h1><ol>${items.map(q => '<li><strong>'+escapeHtml(q.question)+'</strong><ul>'+q.options.map(o=>'<li>'+escapeHtml(o)+'</li>').join('')+'</ul><p>Answer: '+escapeHtml(q.answer)+'</p></li>').join('')}</ol></body></html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'quiz-draft.html'; document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('preview').addEventListener('click', () => {
        const text = document.getElementById('draft-area').value;
        const items = parseDraft(text);
        const container = document.getElementById('preview-area');
        container.innerHTML = '<ol>' + items.map(q => '<li><strong>'+escapeHtml(q.question)+'</strong><ul>'+q.options.map(o=>'<li>'+escapeHtml(o)+'</li>').join('')+'</ul><p><em>Answer: '+escapeHtml(q.answer)+'</em></p></li>').join('') + '</ol>';
      });

      function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    </script>
  </body>
</html>
